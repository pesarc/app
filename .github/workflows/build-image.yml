name: Build & push web image

# Builds the amd64 container on every push to main and pushes it to GHCR, so a
# deploy is one `git push`. Optionally SSHes into the droplet to pull + restart.
#
# Build-time client env (NEXT_PUBLIC_*, inlined into the client bundle):
#   deploy/build.env  — PUBLIC config (addresses, URLs, chain IDs), version-
#                       controlled. NEXT_PUBLIC_* ships to the browser, so it is
#                       not secret; edit + commit to change it.
#   Secrets appended at build (abuse-sensitive, not committed):
#     NEXT_PUBLIC_PRIVY_APP_ID, NEXT_PUBLIC_ALCHEMY_API_KEY,
#     NEXT_PUBLIC_ALCHEMY_GAS_POLICY_ID
#   Legacy: BUILD_DOTENV (full blob) is still used as a fallback until the three
#   secrets above are set — then delete it. Server secrets belong on the host.
# Optional (enable the deploy job):
#   repo variable DEPLOY_TO_DROPLET = "true"
#   secrets DROPLET_HOST, DROPLET_USER, DROPLET_SSH_KEY

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "Dockerfile"
      - "pnpm-lock.yaml"
      - "deploy/build.env"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pesarc-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "ref=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Provide build-time .env (NEXT_PUBLIC_* only)
        # Public NEXT_PUBLIC_* config is version-controlled in deploy/build.env;
        # the few abuse-sensitive values come from individual secrets and are
        # APPENDED here. Falls back to the legacy BUILD_DOTENV blob when the
        # individual secrets aren't set yet, so migration is zero-downtime:
        # set the three secrets, then delete BUILD_DOTENV to switch over.
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}" ]; then
            echo "env: deploy/build.env + individual secrets"
            cat deploy/build.env > .env.ci
            {
              echo "NEXT_PUBLIC_PRIVY_APP_ID=${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}"
              echo "NEXT_PUBLIC_ALCHEMY_API_KEY=${{ secrets.NEXT_PUBLIC_ALCHEMY_API_KEY }}"
              echo "NEXT_PUBLIC_ALCHEMY_GAS_POLICY_ID=${{ secrets.NEXT_PUBLIC_ALCHEMY_GAS_POLICY_ID }}"
            } >> .env.ci
          else
            echo "env: legacy BUILD_DOTENV secret"
            printf '%s' "${{ secrets.BUILD_DOTENV }}" > .env.ci
          fi

      - name: Build & push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
          secret-files: |
            dotenv=.env.ci
          # Ties the build layer's cache to the inlined env: when BUILD_DOTENV
          # changes this hash changes and the Next build re-runs. BuildKit keeps
          # --secret content out of the cache key, so without this a changed
          # BUILD_DOTENV would silently reuse the old client bundle. See the
          # Dockerfile's ARG DOTENV_HASH.
          build-args: |
            DOTENV_HASH=${{ hashFiles('.env.ci') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_TO_DROPLET == 'true' }}
    steps:
      - name: Pull + restart on the droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            podman pull ghcr.io/${{ github.repository_owner }}/pesarc-web:latest
            sudo systemctl restart pesarc-web
